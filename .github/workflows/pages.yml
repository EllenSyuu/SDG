name: Explorer (GitHub Pages)

# Builds the explorer from synthetic demo data and deploys it.
# Run manually once Pages is enabled (Settings -> Pages -> Source: GitHub Actions).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - name: Build explorer from synthetic data
        run: |
          sdg4v demo
          sdg4v explorer --out site/data.json
          cp docs/explorer/index.html site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
