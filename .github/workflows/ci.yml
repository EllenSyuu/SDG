name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Type-check
        run: python -m mypy
      - name: Test (synthetic data; real-data tests skip)
        run: python -m pytest --cov --cov-report=term-missing
      - name: End-to-end demo
        run: sdg4v demo
      - name: README assets render
        run: python scripts/render_assets.py
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: demo-figures
          path: build/demo/figures
