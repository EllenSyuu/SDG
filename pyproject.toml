[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sdg4-revision-tracker"
version = "0.1.0"
description = "SDG 4 Data Revision Tracker: measure how education statistics change from one data release to the next."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ziyi Zhou" }]
requires-python = ">=3.11"
keywords = ["SDG 4", "official statistics", "data vintages", "real-time data", "data quality", "polars"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "polars>=1.10",
  "pyarrow>=15",
  "pydantic>=2.6",
  "pyyaml>=6",
  "matplotlib>=3.8",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.17,<0.18",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
sdg4-revisions = "sdg4_revisions.cli:app"

[project.urls]
Homepage = "https://github.com/EllenSyuu/SDG"
Repository = "https://github.com/EllenSyuu/SDG"
Documentation = "https://github.com/EllenSyuu/SDG/tree/main/docs"
Changelog = "https://github.com/EllenSyuu/SDG/blob/main/CHANGELOG.md"
Issues = "https://github.com/EllenSyuu/SDG/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sdg4_revisions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["sdg4_revisions"]
omit = ["src/sdg4_revisions/cli.py", "src/sdg4_revisions/plots.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "NPY", "PERF"]
ignore = ["PLR0913", "PLR2004", "RUF001", "RUF002"]

[tool.mypy]
strict = true
warn_unused_ignores = true
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true
